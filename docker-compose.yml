version: "3.9"

services:
  bot:
    # Remote deploy: set PINGLUMA_IMAGE=yourdockerhub/pingluma:latest in .env (or export before compose).
    image: ${PINGLUMA_IMAGE:-pingluma:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"