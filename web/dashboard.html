<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>پینگ‌لوما — بررسی پیام‌رسان‌های ایرانی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;900&display=swap"
          rel="stylesheet"/>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0e0c;
            --surface: #181714;
            --border: #262420;
            --amber: #d4871a;
            --amber-lt: #f0a030;
            --green: #22a050;
            --red: #c83030;
            --warn: #c08010;
            --muted: #706858;
            --dim: #a09080;
            --text: #f0ebe0;
            --fa: 'Vazirmatn', sans-serif;
            --radius: 14px;
            --tg-color-scheme: dark;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--tg-theme-bg-color, var(--bg));
            color: var(--tg-theme-text-color, var(--text));
            font-family: var(--fa);
            min-height: 100dvh;
            direction: rtl;
            overscroll-behavior: none;
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 1rem env(safe-area-inset-bottom, 1rem);
        }

        /* ── header ── */
        .header {
            padding: 1.5rem 0 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.4rem;
        }

        .logo {
            font-size: 1.55rem;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -.02em;
            line-height: 1;
        }

        .logo span {
            color: var(--amber-lt);
        }

        .header-sub {
            font-size: .68rem;
            color: var(--muted);
            text-align: left;
        }

        /* ── scan button ── */
        .scan-btn {
            width: 100%;
            padding: 1rem;
            background: var(--amber);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: var(--fa);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .55rem;
            margin-bottom: 1.25rem;
            transition: background .18s, transform .1s;
            -webkit-user-select: none;
        }

        .scan-btn:active {
            transform: scale(.97);
            background: var(--amber-lt);
        }

        .scan-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }

        /* ── status pill ── */
        .status-pill {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .65rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-size: .8rem;
            color: var(--dim);
            min-height: 44px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
        }

        .dot.live {
            background: var(--amber-lt);
            animation: pulse 1.6s infinite;
        }

        .dot.ok {
            background: var(--green);
        }

        .dot.fail {
            background: var(--red);
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .5;
                transform: scale(1.5);
            }
        }

        /* ── messenger cards ── */
        .cards {
            display: flex;
            flex-direction: column;
            gap: .7rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color .2s;
        }

        .card.ok {
            border-color: rgba(34, 160, 80, .3);
        }

        .card.warn {
            border-color: rgba(192, 128, 16, .3);
        }

        .card.fail {
            border-color: rgba(200, 48, 48, .3);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .85rem 1rem;
        }

        .icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 900;
            flex-shrink: 0;
            color: #fff;
        }

        .ic-bale {
            background: #1a73c8;
        }

        .ic-eitaa {
            background: #e06a10;
        }

        .ic-rubika {
            background: #1a5fd0;
        }

        .ic-gap {
            background: #18a03a;
        }

        .ic-igap {
            background: #6220aa;
        }

        .ic-soroush {
            background: #2850c8;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: .9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        .card-name-fa {
            font-size: .72rem;
            color: var(--muted);
            margin-top: .1rem;
        }

        .badge {
            font-size: .62rem;
            font-weight: 700;
            padding: .18rem .5rem;
            border-radius: 5px;
            white-space: nowrap;
        }

        .badge-ok {
            background: rgba(34, 160, 80, .15);
            color: #22a050;
        }

        .badge-warn {
            background: rgba(192, 128, 16, .15);
            color: #c08010;
        }

        .badge-fail {
            background: rgba(200, 48, 48, .13);
            color: #c83030;
        }

        .badge-idle {
            background: rgba(112, 104, 88, .15);
            color: var(--muted);
        }

        /* ── card rows ── */
        .card-rows {
            border-top: 1px solid var(--border);
            padding: .6rem 1rem .75rem;
            display: flex;
            flex-direction: column;
            gap: .45rem;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: .78rem;
        }

        .row-label {
            color: var(--muted);
        }

        .row-val {
            font-weight: 600;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: .28rem;
            font-size: .72rem;
            font-weight: 600;
            padding: .14rem .48rem;
            border-radius: 5px;
        }

        .tag-ok {
            background: rgba(34, 160, 80, .13);
            color: #22a050;
        }

        .tag-warn {
            background: rgba(192, 128, 16, .13);
            color: #c08010;
        }

        .tag-fail {
            background: rgba(200, 48, 48, .12);
            color: #c83030;
        }

        .tag-blue {
            background: rgba(58, 127, 240, .12);
            color: #4a8ff0;
        }

        .tag-dim {
            background: rgba(112, 104, 88, .12);
            color: var(--dim);
        }

        /* ── latency ── */
        .lat {
            font-size: .68rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .lat.fast {
            color: var(--green);
        }

        .lat.ok {
            color: #a0c860;
        }

        .lat.slow {
            color: var(--warn);
        }

        /* ── summary bar ── */
        .summary {
            margin-top: 1.1rem;
            padding: .85rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .sum-item {
            display: flex;
            flex-direction: column;
            gap: .25rem;
        }

        .sum-num {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .sum-lbl {
            font-size: .65rem;
            color: var(--muted);
        }

        .sum-num.ok {
            color: var(--green);
        }

        .sum-num.warn {
            color: var(--warn);
        }

        .sum-num.fail {
            color: var(--red);
        }

        /* ── footer ── */
        footer {
            margin-top: 1.8rem;
            padding: .9rem 0 1rem;
            border-top: 1px solid var(--border);
            font-size: .65rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
        }

        /* ── spinner ── */
        .spin {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .5s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* light theme overrides */
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f5f0e8;
                --surface: #fff;
                --border: #e0d8cc;
                --text: #1a1810;
                --muted: #8a7a68;
                --dim: #5a4a3a;
            }
        }
    </style>
</head>
<body>
<div class="page">

    <header class="header">
        <div class="logo">پینگ<span>لوما</span></div>
        <div class="header-sub" id="headerDate"></div>
    </header>

    <button class="scan-btn" id="btnScan" onclick="runScan()">
        <span id="btnLabel">بررسی همه پیام‌رسان‌ها</span>
    </button>

    <div class="status-pill">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">برای بررسی دسترسی از شبکه فعلی خود دکمه بالا را بزنید.</span>
    </div>

    <div class="cards" id="cards"></div>

    <div class="summary" id="summary" style="display:none;"></div>

    <footer>
        نتایج فقط بازتاب‌دهنده وضعیت شبکه <b>شما</b> هستند<br>
        هیچ داده‌ای ذخیره یا ارسال نمی‌شود
    </footer>
</div>

<script>
    'use strict';

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();

        if (tg.colorScheme === 'light') {
            document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#f5f0e8');
            document.documentElement.style.setProperty('--surface', tg.themeParams.secondary_bg_color || '#fff');
            document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#1a1810');
        }
    }

    const MESSENGERS = [
        {
            id: 'bale', fa: 'بله', en: 'Bale', letter: 'ب', ic: 'ic-bale',
            urls: ['https://tapi.bale.ai', 'https://web.bale.ai'],
            dns: ['tapi.bale.ai', 'web.bale.ai', 'cdn.bale.ai'],
            stun: ['stun:stun.bale.ai:3478', 'stun:tapi.bale.ai:3478'],
            callOutside: 'yes', callVpnAny: true, reg: 'sms',
        },
        {
            id: 'eitaa', fa: 'ایتا', en: 'Eitaa', letter: 'ا', ic: 'ic-eitaa',
            urls: ['https://eitaa.com', 'https://api.eitaa.com'],
            dns: ['eitaa.com', 'api.eitaa.com'],
            stun: ['stun:stun.eitaa.com:3478'],
            callOutside: 'vpn', callVpnAny: false, reg: 'no',
        },
        {
            id: 'rubika', fa: 'روبیکا', en: 'Rubika', letter: 'ر', ic: 'ic-rubika',
            urls: ['https://rubika.ir', 'https://getapp.rubika.ir'],
            dns: ['rubika.ir', 'getapp.rubika.ir'],
            stun: [],
            callOutside: 'vpn', callVpnAny: false, reg: 'no', proprietary: true,
        },
        {
            id: 'gap', fa: 'گپ', en: 'Gap', letter: 'گ', ic: 'ic-gap',
            urls: ['https://gap.im', 'https://api.gap.im'],
            dns: ['gap.im', 'api.gap.im'],
            stun: ['stun:stun.gap.im:3478'],
            callOutside: 'partial', callVpnAny: true, reg: 'sms',
        },
        {
            id: 'igap', fa: 'آی‌گپ', en: 'iGap', letter: 'آ', ic: 'ic-igap',
            urls: ['https://igap.net', 'https://api.igap.net'],
            dns: ['igap.net', 'api.igap.net'],
            stun: ['stun:stun.igap.net:3478', 'stun:stun2.igap.net:3478'],
            callOutside: 'yes', callVpnAny: true, reg: 'yes',
        },
        {
            id: 'soroush', fa: 'سروش‌پلاس', en: 'Soroush+', letter: 'س', ic: 'ic-soroush',
            urls: ['https://soroushapp.com', 'https://api.soroushapp.com'],
            dns: ['soroushapp.com', 'api.soroushapp.com'],
            stun: [],
            callOutside: 'no', callVpnAny: false, reg: 'no', proprietary: true,
        },
    ];

    const CHAT_LABEL = {ok: 'در دسترس', warn: 'ناپایدار', fail: 'مسدود', idle: '—'};

    function callTag(callOutside) {
        const map = {
            yes: ['tag-ok', '✅ بدون VPN'],
            partial: ['tag-warn', '⚠️ ناپایدار'],
            vpn: ['tag-blue', '🔒 VPN ایرانی'],
            no: ['tag-fail', '❌ مسدود'],
        };
        const [cls, txt] = map[callOutside] || ['tag-dim', '❓'];
        return `<span class="tag ${cls}">${txt}</span>`;
    }

    function vpnTag(m) {
        if (m.callOutside === 'no') return `<span class="tag tag-fail">❌ VPN کمکی نمی‌کند</span>`;
        if (m.callVpnAny) return `<span class="tag tag-ok">✅ هر VPN</span>`;
        return `<span class="tag tag-warn">⚠️ فقط VPN ایرانی</span>`;
    }

    function regTag(reg) {
        const map = {
            yes: ['tag-ok', '✅ آزاد'],
            no: ['tag-fail', '❌ مسدود'],
            sms: ['tag-blue', '📱 شماره ایرانی'],
        };
        const [cls, txt] = map[reg] || ['tag-dim', '❓'];
        return `<span class="tag ${cls}">${txt}</span>`;
    }

    function latClass(ms) {
        if (!ms) return '';
        return ms < 400 ? 'fast' : ms < 900 ? 'ok' : 'slow';
    }

    async function probeUrl(url, ms = 8000) {
        const t = performance.now();
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            await fetch(url, {mode: 'no-cors', signal: ctrl.signal});
            clearTimeout(timer);
            return {ok: true, lat: Math.round(performance.now() - t)};
        } catch {
            return {ok: false, lat: null};
        }
    }

    async function probeDns(host) {
        return new Promise(resolve => {
            const t = performance.now();
            const img = new Image();
            const tmr = setTimeout(() => {
                img.src = '';
                resolve(false);
            }, 5000);
            img.onload = img.onerror = () => {
                clearTimeout(tmr);
                resolve(true);
            };
            img.src = `https://${host}/favicon.ico?_=${Date.now()}`;
        });
    }

    async function probeStun(stunUrls, ms = 7000) {
        if (!stunUrls?.length) return null;
        const t = performance.now();
        let pc, done = false, gotSrflx = false;
        const candidates = [];
        try {
            pc = new RTCPeerConnection({iceServers: stunUrls.map(u => ({urls: u}))});
        } catch {
            return null;
        }
        return new Promise(resolve => {
            const finish = v => {
                if (done) return;
                done = true;
                clearTimeout(timer);
                try {
                    pc.close();
                } catch {
                }
                resolve({ok: v, lat: Math.round(performance.now() - t), candidates});
            };
            const timer = setTimeout(() => finish(gotSrflx), ms);
            pc.onicecandidate = e => {
                if (!e.candidate) {
                    finish(gotSrflx);
                    return;
                }
                candidates.push(e.candidate.type);
                if (e.candidate.type === 'srflx' || e.candidate.type === 'relay') {
                    gotSrflx = true;
                    finish(true);
                }
            };

            pc.onicegatheringstatechange = () => {
                if (pc.iceGatheringState === 'complete') finish(gotSrflx);
            };
            pc.createDataChannel('pl');
            pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => finish(false));
        });
    }

    async function probeMessenger(m) {
        const [urlRes, dnsOk] = await Promise.all([
            Promise.all(m.urls.map(u => probeUrl(u))),
            Promise.all(m.dns.map(h => probeDns(h))),
        ]);
        const okUrls = urlRes.filter(r => r.ok).length;
        const okDns = dnsOk.filter(Boolean).length;
        let score = Math.round((okUrls / m.urls.length) * 60 + (okDns / m.dns.length) * 30);
        const lats = urlRes.filter(r => r.ok && r.lat).map(r => r.lat);
        if (lats.length) {
            const b = Math.min(...lats);
            score += b < 500 ? 10 : b < 1200 ? 5 : 0;
        }
        score = Math.min(100, score);
        const chatVerdict = score >= 70 ? 'ok' : score >= 30 ? 'warn' : 'fail';

        let callOk = null;
        if (!m.proprietary && m.stun.length) {
            const s = await probeStun(m.stun, 7000);
            callOk = s?.ok ?? false;
        }

        return {
            chatVerdict,
            lat: lats.length ? Math.min(...lats) : null,
            callOk,
        };
    }

    function chatBadge(v) {
        const cls = {ok: 'badge-ok', warn: 'badge-warn', fail: 'badge-fail', idle: 'badge-idle'}[v] || 'badge-idle';
        return `<span class="badge ${cls}">${CHAT_LABEL[v] || '—'}</span>`;
    }

    function callResultTag(m, callOk) {
        if (callOk === null) return `<span class="tag tag-dim">قابل تست نیست</span>`;
        if (callOk) return `<span class="tag tag-ok">✅ تماس ممکن</span>`;
        return `<span class="tag tag-fail">❌ تماس مسدود</span>`;
    }

    function renderCard(m, result /* null = loading */) {
        const v = result ? result.chatVerdict : 'idle';
        const lat = result?.lat;
        const latHtml = lat
            ? `<span class="lat ${latClass(lat)}">${lat}ms</span>`
            : '';

        return `
  <div class="card ${result ? v : ''}" id="card-${m.id}">
    <div class="card-top">
      <div class="icon ${m.ic}">${m.letter}</div>
      <div class="card-info">
        <div class="card-name">
          ${m.en} <span style="color:var(--muted);font-weight:400;font-size:.75rem">${m.fa}</span>
          ${latHtml}
        </div>
        <div class="card-name-fa">${result ? '' : '<span class="spin"></span>'}</div>
      </div>
      ${chatBadge(v)}
    </div>
    ${result ? `
    <div class="card-rows">
      <div class="row">
        <span class="row-label">💬 چت</span>
        <span class="row-val">${chatBadge(v)}</span>
      </div>
      <div class="row">
        <span class="row-label">📞 تماس از خارج</span>
        <span class="row-val">${callResultTag(m, result.callOk)}</span>
      </div>
      <div class="row">
        <span class="row-label">📞 بدون VPN</span>
        <span class="row-val">${callTag(m.callOutside)}</span>
      </div>
      <div class="row">
        <span class="row-label">🔒 با VPN</span>
        <span class="row-val">${vpnTag(m)}</span>
      </div>
      <div class="row">
        <span class="row-label">📝 ثبت‌نام</span>
        <span class="row-val">${regTag(m.reg)}</span>
      </div>
    </div>` : ''}
  </div>`;
    }

    let busy = false;

    function setStatus(live, txt) {
        const dot = document.getElementById('statusDot');
        dot.className = 'dot' + (live ? ' live' : '');
        document.getElementById('statusText').textContent = txt;
    }

    async function runScan() {
        if (busy) return;
        busy = true;
        tg?.HapticFeedback?.impactOccurred('light');

        const btn = document.getElementById('btnScan');
        btn.disabled = true;
        document.getElementById('btnLabel').innerHTML = '<span class="spin"></span> در حال بررسی…';
        document.getElementById('summary').style.display = 'none';

        const cards = document.getElementById('cards');
        cards.innerHTML = MESSENGERS.map(m => renderCard(m, null)).join('');
        setStatus(true, `بررسی ${MESSENGERS.length} پیام‌رسان از شبکه شما…`);

        const results = new Array(MESSENGERS.length).fill(null);

        await Promise.all(MESSENGERS.map((m, i) =>
            probeMessenger(m).then(r => {
                results[i] = r;
                const el = document.getElementById(`card-${m.id}`);
                if (el) el.outerHTML = renderCard(m, r);
            })
        ));

        // summary
        const nOk = results.filter(r => r?.chatVerdict === 'ok').length;
        const nWarn = results.filter(r => r?.chatVerdict === 'warn').length;
        const nFail = results.filter(r => r?.chatVerdict === 'fail').length;

        document.getElementById('summary').style.display = 'flex';
        document.getElementById('summary').innerHTML = `
    <div class="sum-item"><div class="sum-num ok">${nOk}</div><div class="sum-lbl">در دسترس</div></div>
    <div class="sum-item"><div class="sum-num warn">${nWarn}</div><div class="sum-lbl">ناپایدار</div></div>
    <div class="sum-item"><div class="sum-num fail">${nFail}</div><div class="sum-lbl">مسدود</div></div>
  `;

        const allOk = nFail === 0 && nWarn === 0;
        setStatus(false,
            allOk
                ? `همه ${nOk} پیام‌رسان از شبکه شما در دسترس هستند ✅`
                : `${nOk} در دسترس · ${nWarn} ناپایدار · ${nFail} مسدود`
        );
        document.getElementById('statusDot').className = `dot ${allOk ? 'ok' : nFail > 0 ? 'fail' : 'live'}`;

        document.getElementById('btnLabel').textContent = 'بررسی مجدد';
        btn.disabled = false;
        busy = false;

        tg?.HapticFeedback?.notificationOccurred(allOk ? 'success' : 'warning');
    }

    (function init() {
        const d = new Date();
        document.getElementById('headerDate').textContent =
            d.toLocaleDateString('fa-IR', {month: 'short', day: 'numeric'})
            + ' — '
            + d.toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit'});
    })();
</script>
