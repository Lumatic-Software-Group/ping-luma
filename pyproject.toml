[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ping-luma"
version = "1.0.0"
description = "Iranian messenger global connectivity bot — @ping_luma_bot"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PingLuma" }]
dependencies = [
    "python-telegram-bot==21.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "ruff==0.4.9",
    "mypy==1.10.1",
]

[tool.setuptools.packages.find]
include = ["ping_luma*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ping_luma"]
omit = ["tests/**/*"]
